log_dir: 'logs/kitchen'
model_load_path: null #'logs/kitchen/kitchen_policy_segmentation_04-07-2023_20-08-25/best_model.pt'
name: 'kitchen_policy_segmentation_sample_autoregression'
device: 'cuda:1'
log_every: 500
viz_every: 1000
np_seed: 0

epochs: 16000

train_dataset: {signal_length: 128, dataset_name: 'kitchen-mixed-v0'}
test_dataset: {signal_length: 128, dataset_name: 'kitchen-mixed-v0'}

dataloader: {batch_size: 64, shuffle: False, num_workers: 0}

temp_scheduler: {type: 'gumbel_softmax', start_step: 0, N: 1000, r: 1.0e-5, max_temp: 0.50, min_temp: 0.50}
# temp_scheduler: {type: 'logarithmic', start_value: 2.0, end_value: 0.1, start_step: 200, end_step: 400}
time_loss_weight_scheduler: {type: 'linear', start_value: 0.0, end_value: 0.100, start_step: 50, end_step: 50}
# state_kl_weight_scheduler: {type: 'linear', start_value: 0.05, end_value: 0.05, start_step: 0, end_step: 100}

defaults:
  - model: full_prototype_v1
  - optimizer: default_optimizer
