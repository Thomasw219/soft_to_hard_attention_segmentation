log_dir: 'logs/moving_mnist'
# model_load_path: 'logs/moving_mnist/original_params_dont_work_04-21-2023_21-59-11/best_model.pt'
model_load_path: null
name: 'frozen_seg_post'
device: 'cuda:0'
log_every: 100
viz_every: 100
np_seed: 0

epochs: 1600

train_dataset: {train : True, deterministic : False, num_digits : 1}
test_dataset: {train : False, deterministic : False, num_digits : 1}

dataloader: {batch_size: 64, shuffle: False, num_workers: 0}

temp_scheduler: {type: 'gumbel_softmax', start_step: 0, N: 1000, r: 1.0e-5, max_temp: 0.50, min_temp: 0.50}
# temp_scheduler: {type: 'logarithmic', start_value: 2.0, end_value: 0.1, start_step: 200, end_step: 400}
time_loss_weight_scheduler: {type: 'linear', start_value: 0.0, end_value: 0.125, start_step: 500, end_step: 500}
# time_loss_weight_scheduler: {type: 'linear', start_value: 0.0, end_value: 0.200, start_step: 0, end_step: 0}
# state_kl_weight_scheduler: {type: 'linear', start_value: 0.05, end_value: 0.05, start_step: 0, end_step: 100}

defaults:
  - model: full_prototype_v1
  - optimizer: default_optimizer
